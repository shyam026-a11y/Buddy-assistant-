name: Jarvis PR APK

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Reconstruct Jarvis source
        shell: bash
        run: |
          set -euo pipefail
          test -f .jarvis-source/jarvis-source-2.0.0.tar.gz.b64
          python3 - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, tarfile
          encoded = Path(".jarvis-source/jarvis-source-2.0.0.tar.gz.b64").read_text(encoding="ascii")
          encoded = "".join(encoded.split())
          if not encoded or len(encoded) % 4 != 0:
              raise SystemExit(f"invalid Base64 length: {len(encoded)}")
          raw = base64.b64decode(encoded, validate=True)
          if raw[:2] != b"\x1f\x8b":
              raise SystemExit("source bundle is not gzip")
          print("source_gzip_bytes=", len(raw))
          print("source_gzip_sha256=", hashlib.sha256(raw).hexdigest())
          tar_bytes = gzip.decompress(raw)
          print("source_tar_bytes=", len(tar_bytes))
          Path("jarvis-source.tar").write_bytes(tar_bytes)
          with tarfile.open("jarvis-source.tar", "r:") as tf:
              names = tf.getnames()
              required = {
                  "jarvis-android/app/build.gradle.kts",
                  "jarvis-android/app/src/main/java/com/example/jarvis/JarvisApp.kt",
              }
              missing = sorted(required - set(names))
              if missing:
                  raise SystemExit("source bundle missing required files: " + ", ".join(missing))
          print("Jarvis source bundle integrity: PASS")
          PY
          rm -rf build-src
          mkdir -p build-src
          tar -xf jarvis-source.tar -C build-src
          test -f build-src/jarvis-android/app/build.gradle.kts
          test -f build-src/jarvis-android/app/src/main/java/com/example/jarvis/JarvisApp.kt
      - name: Enable GLM-5.2 defaults
        working-directory: build-src/jarvis-android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              'buildConfigField("String", "MODEL_BASE_URL", "\"\")',
              'buildConfigField("String", "MODEL_BASE_URL", "\"https://api.z.ai/api/paas/v4/chat/completions\"")'
          )
          s = s.replace(
              'buildConfigField("String", "MODEL_NAME", "\"\")',
              'buildConfigField("String", "MODEL_NAME", "\"glm-5.2\"")'
          )
          p.write_text(s)
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: build-src/jarvis-android
        shell: bash
        run: |
          set -euxo pipefail
          gradle :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find build-src/jarvis-android/app/build/outputs -type f -name '*debug*.apk' -print -exec cp {} artifacts/jarvis-debug.apk \;
          test -f artifacts/jarvis-debug.apk
          sha256sum artifacts/jarvis-debug.apk > artifacts/SHA256SUMS.txt
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-glm-5.2-debug-apk
          path: artifacts/
