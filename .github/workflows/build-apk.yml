name: Jarvis APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Jarvis source branch
        run: git fetch origin jarvis-2.0.0-apk-build && git checkout --detach origin/jarvis-2.0.0-apk-build

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Reconstruct Jarvis source
        shell: bash
        run: |
          set -euo pipefail
          test -d .jarvis-source/xzparts
          shopt -s nullglob
          parts=(.jarvis-source/xzparts/c*.b64)
          test "${#parts[@]}" -eq 55
          cat "${parts[@]}" > jarvis-app.tar.xz.b64
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, tarfile
          encoded = "".join(Path("jarvis-app.tar.xz.b64").read_text(encoding="ascii").split())
          encoded = encoded.rstrip("=")
          encoded += "=" * ((4 - len(encoded) % 4) % 4)
          raw = base64.b64decode(encoded, validate=True)
          print("xz_bytes=", len(raw))
          print("xz_sha256=", hashlib.sha256(raw).hexdigest())
          if raw[:6] != b"\xfd7zXZ\x00":
              raise SystemExit("Jarvis source is not XZ")
          try:
              tar_bytes = lzma.decompress(raw)
          except lzma.LZMAError as exc:
              raise SystemExit(f"Jarvis XZ decompression failed: {exc}")
          Path("jarvis-source.tar").write_bytes(tar_bytes)
          with tarfile.open("jarvis-source.tar", "r:") as tf:
              names = set(tf.getnames())
          required = {
              "settings.gradle.kts",
              "app/build.gradle.kts",
              "app/src/main/java/com/example/jarvis/JarvisApp.kt",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit("Jarvis source missing: " + ", ".join(missing))
          print("Jarvis XZ source integrity: PASS")
          PY
          rm -rf build-src
          mkdir -p build-src/jarvis-android
          tar -xf jarvis-source.tar -C build-src/jarvis-android
          test -f build-src/jarvis-android/settings.gradle.kts
          test -f build-src/jarvis-android/app/build.gradle.kts
          test -f build-src/jarvis-android/app/src/main/java/com/example/jarvis/JarvisApp.kt
      - name: Build pinned Kokoro AAR
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kokoro-android
          git clone --recursive --depth 1 https://github.com/ffmpegkit-maintained/kokoro-android.git /tmp/kokoro-android
          cd /tmp/kokoro-android
          chmod +x gradlew
          cmake -S espeak-ng -B /tmp/espeak-build -DCMAKE_BUILD_TYPE=Release -DUSE_MBROLA=OFF -DUSE_LIBSONIC=OFF -DUSE_LIBPCAUDIO=OFF -DUSE_SPEECHPLAYER=OFF
          cmake --build /tmp/espeak-build --target data -j2
          test -d /tmp/espeak-build/espeak-ng-data
          rm -rf library/src/main/assets/espeak-ng-data
          mkdir -p library/src/main/assets/espeak-ng-data
          cp -r /tmp/espeak-build/espeak-ng-data/. library/src/main/assets/espeak-ng-data/
          test -f library/src/main/assets/espeak-ng-data/phontab
          ./gradlew :library:assembleRelease --no-daemon --stacktrace
          test -f library/build/outputs/aar/library-release.aar
          mkdir -p "$GITHUB_WORKSPACE/build-src/jarvis-android/app/libs"
          cp library/build/outputs/aar/library-release.aar "$GITHUB_WORKSPACE/build-src/jarvis-android/app/libs/kokoro-android-0.1.0.aar"
          sha256sum library/build/outputs/aar/library-release.aar

      - name: Wire local Kokoro AAR
        working-directory: build-src/jarvis-android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          maven = 'implementation("dev.ffmpegkit-maintained:kokoro-android:0.1.0")'
          local = 'implementation(files("libs/kokoro-android-0.1.0.aar"))'
          if maven in s:
              s = s.replace(maven, local)
          elif local not in s:
              raise SystemExit("Kokoro dependency declaration not found")
          if 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0' not in s:
              anchor = 'implementation("com.squareup.okhttp3:okhttp:5.3.0")'
              if anchor not in s:
                  raise SystemExit("OkHttp dependency anchor not found")
              s = s.replace(anchor, anchor + '\n    implementation("com.microsoft.onnxruntime:onnxruntime-android:1.20.0")', 1)
          p.write_text(s)
          PY
          test -f app/libs/kokoro-android-0.1.0.aar
          grep -q 'kokoro-android-0.1.0.aar' app/build.gradle.kts
          grep -q 'onnxruntime-android:1.20.0' app/build.gradle.kts

      - name: Pin AndroidX compatibility set
        working-directory: build-src/jarvis-android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          replacements = {
              'androidx.compose:compose-bom:2026.09.00': 'androidx.compose:compose-bom:2025.09.00',
              'androidx.core:core-ktx:1.19.0': 'androidx.core:core-ktx:1.17.0',
              'androidx.activity:activity-compose:1.13.0': 'androidx.activity:activity-compose:1.11.0',
              'androidx.lifecycle:lifecycle-runtime-compose:2.10.0': 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4',
              'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0': 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4',
              'androidx.navigation:navigation-compose:2.9.8': 'androidx.navigation:navigation-compose:2.9.5',
              'androidx.work:work-runtime-ktx:2.11.2': 'androidx.work:work-runtime-ktx:2.10.5',
              'androidx.datastore:datastore-preferences:1.2.1': 'androidx.datastore:datastore-preferences:1.1.7',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY
          grep -q 'compose-bom:2025.09.00' app/build.gradle.kts
          grep -q 'core-ktx:1.17.0' app/build.gradle.kts
          grep -q 'activity-compose:1.11.0' app/build.gradle.kts
          grep -q 'lifecycle-runtime-compose:2.9.4' app/build.gradle.kts
          grep -q 'navigation-compose:2.9.5' app/build.gradle.kts
          grep -q 'work-runtime-ktx:2.10.5' app/build.gradle.kts
          grep -q 'datastore-preferences:1.1.7' app/build.gradle.kts

      - name: Set GLM-5.2 defaults
        working-directory: build-src/jarvis-android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          lines = p.read_text().splitlines()
          out = []
          base = False
          model = False
          for line in lines:
              stripped = line.strip()
              if 'buildConfigField("String", "MODEL_BASE_URL"' in stripped:
                  line = '        buildConfigField("String", "MODEL_BASE_URL", "\\"https://api.z.ai/api/paas/v4/chat/completions\\"")'
                  base = True
              elif 'buildConfigField("String", "MODEL_NAME"' in stripped:
                  line = '        buildConfigField("String", "MODEL_NAME", "\\"glm-5.2\\"")'
                  model = True
              out.append(line)
          if not (base and model):
              raise SystemExit(f"GLM config declarations not found: base={base}, model={model}")
          p.write_text("\n".join(out) + "\n")
          PY
          grep -q 'MODEL_BASE_URL' app/build.gradle.kts
          grep -q 'MODEL_NAME' app/build.gradle.kts
          grep -q 'glm-5.2' app/build.gradle.kts
      - name: Test
        working-directory: build-src/jarvis-android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        working-directory: build-src/jarvis-android
        run: gradle :app:lintRelease --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: build-src/jarvis-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp build-src/jarvis-android/app/build/outputs/apk/debug/*.apk artifacts/jarvis-debug.apk
          sha256sum artifacts/jarvis-debug.apk > artifacts/SHA256SUMS.txt
          printf 'model=glm-5.2\nsource=jarvis-2.0.0-apk-build\n' > artifacts/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-glm-5.2-apk
          path: artifacts
          if-no-files-found: error
          retention-days: 90
