name: Buddy Assistant APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle test --no-daemon --stacktrace

      - name: Source regression checks
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          files = {
              "router": Path("app/src/main/java/com/shyam026/buddyassistant/CommandRouter.java").read_text(),
              "voice": Path("app/src/main/java/com/shyam026/buddyassistant/BuddyVoiceService.java").read_text(),
              "main": Path("app/src/main/java/com/shyam026/buddyassistant/MainActivity.java").read_text(),
              "settings": Path("app/src/main/java/com/shyam026/buddyassistant/BuddySettingsActivity.java").read_text(),
              "secrets": Path("app/src/main/java/com/shyam026/buddyassistant/BuddySecrets.java").read_text(),
              "engine": Path("app/src/main/java/com/shyam026/buddyassistant/CommandEngine.java").read_text(),
              "catalog": Path("app/src/main/java/com/shyam026/buddyassistant/GeminiModelCatalog.java").read_text(),
              "client": Path("app/src/main/java/com/shyam026/buddyassistant/GeminiApiClient.java").read_text(),
              "manifest": Path("app/src/main/AndroidManifest.xml").read_text(),
          }

          checks = [
              ("wake phrase exact", 'n.equals("hey buddy")' in files["router"]),
              ("wake phrase prefix", 'n.startsWith("hey buddy ")' in files["router"]),
              ("Buddy prefix", 'n.startsWith("buddy ")' in files["router"]),
              ("processing state", "STATE_PROCESSING" in files["voice"]),
              ("microphone foreground permission", "FOREGROUND_SERVICE_MICROPHONE" in files["manifest"]),
              ("no legacy wake-recursion", "startRecognition(true)" not in files["voice"] and "scheduleWake" not in files["voice"]),
              ("no pending wake hack", "pending_wake_start" not in files["main"]),
              ("direct Gemini key access", "BuddySecrets.getGeminiApiKey" in files["engine"]),
              ("native Gemini auth", "x-goog-api-key" in files["engine"]),
              ("Gemini endpoint", "generativelanguage.googleapis.com" in files["engine"]),
              ("current default model", "gemini-3.8-flash" in files["secrets"]),
              ("model catalog", "GeminiModelCatalog" in files["catalog"]),
              ("generateContent filter", "supportedGenerationMethods" in files["catalog"]),
              ("save and verify UI", "SAVE & VERIFY KEY" in files["settings"]),
              ("connectivity tester", "GeminiApiClient.test" in files["settings"]),
              ("settings content description", "Open Buddy Settings" in files["main"]),
              ("real voice tuning", "applyVoiceTuning" in files["voice"]),
              ("voice orb action", "Tap to talk to Buddy" in files["main"] and "orb.setOnClickListener" in files["main"]),
              ("wake action wired", "ACTION_ENABLE_WAKE" in files["main"]),
              ("wake listener", "startWakeRecognition" in files["voice"]),
              ("wake transcript handler", "handleWakeTranscript" in files["voice"]),
              ("secure packed storage", "split(" in files["secrets"]),
              ("try-saying removed", "TRY SAYING" not in files["main"]),
              ("OpenRouter removed", "openrouter" not in "\n".join(files.values()).lower()),
          ]

          failed = [name for name, ok in checks if not ok]
          for name, ok in checks:
              print(("PASS " if ok else "FAIL ") + name)

          if failed:
              raise SystemExit("Regression checks failed: " + ", ".join(failed))
          print(f"All {len(checks)} named source checks passed.")
          PY

      - name: 100x invariant sweep
        shell: bash
        run: |
          set -e
          for i in $(seq 1 100); do
            grep -q 'SAVE & VERIFY KEY' app/src/main/java/com/shyam026/buddyassistant/BuddySettingsActivity.java
            grep -q 'GeminiApiClient.test' app/src/main/java/com/shyam026/buddyassistant/BuddySettingsActivity.java
            grep -q 'x-goog-api-key' app/src/main/java/com/shyam026/buddyassistant/GeminiApiClient.java
            grep -q 'orb.setOnClickListener' app/src/main/java/com/shyam026/buddyassistant/MainActivity.java
            grep -q 'startWakeRecognition' app/src/main/java/com/shyam026/buddyassistant/BuddyVoiceService.java
          done

      - name: Lint
        run: gradle lintDebug --no-daemon --stacktrace

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build metadata
        shell: bash
        run: |
          set -e
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SHA="$(sha256sum "$APK" | awk '{print $1}')"
          {
            echo "commit=$GITHUB_SHA"
            echo "apk_sha256=$SHA"
            echo "versionName=4.1-BuddyVoice"
          } > build-metadata.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Buddy-V4.1-Verified
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            build-metadata.txt
          if-no-files-found: error
          retention-days: 90
