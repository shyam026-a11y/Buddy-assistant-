name: Jarvis APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Jarvis source branch
        run: git fetch origin jarvis-2.0.0-apk-build && git checkout --detach origin/jarvis-2.0.0-apk-build

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Reconstruct Jarvis project
        run: |
          set -euo pipefail
          rm -rf /tmp/jarvis-src /tmp/jarvis-src.bin
          mkdir -p /tmp/jarvis-src
          for part in .jarvis-source/pkg/q*.b64; do
            base64 -d "$part" >> /tmp/jarvis-src.bin || true
          done
          gzip -t /tmp/jarvis-src.bin
          tar -tzf /tmp/jarvis-src.bin >/dev/null
          tar -xzf /tmp/jarvis-src.bin -C /tmp/jarvis-src
          test -f /tmp/jarvis-src/jarvis-android/app/build.gradle.kts

      - name: Set GLM-5.2 defaults
        run: |
          set -euo pipefail
          cd /tmp/jarvis-src/jarvis-android
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          s=s.replace('buildConfigField("String", "MODEL_BASE_URL", "\"\")',
                      'buildConfigField("String", "MODEL_BASE_URL", "\"https://api.z.ai/api/paas/v4/chat/completions\"")')
          s=s.replace('buildConfigField("String", "MODEL_NAME", "\"\")',
                      'buildConfigField("String", "MODEL_NAME", "\"glm-5.2\"")')
          p.write_text(s)
          PY
          grep -q "glm-5.2" app/build.gradle.kts

      - name: Test
        working-directory: /tmp/jarvis-src/jarvis-android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        working-directory: /tmp/jarvis-src/jarvis-android
        run: gradle :app:lintRelease --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: /tmp/jarvis-src/jarvis-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp /tmp/jarvis-src/jarvis-android/app/build/outputs/apk/debug/*.apk artifacts/jarvis-debug.apk
          sha256sum artifacts/jarvis-debug.apk > artifacts/SHA256SUMS.txt
          printf 'model=glm-5.2\nsource=jarvis-2.0.0-apk-build\n' > artifacts/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-glm-5.2-apk
          path: artifacts
          if-no-files-found: error
          retention-days: 90
