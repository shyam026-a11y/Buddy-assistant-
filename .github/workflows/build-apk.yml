name: Jarvis APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Jarvis source branch
        run: git fetch origin jarvis-2.0.0-apk-build && git checkout --detach origin/jarvis-2.0.0-apk-build

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Reconstruct Jarvis source
        shell: bash
        run: |
          set -euo pipefail
          test -d .jarvis-source/xzparts
          shopt -s nullglob
          parts=(.jarvis-source/xzparts/c*.b64)
          test "${#parts[@]}" -eq 53
          cat "${parts[@]}" > jarvis-app.tar.xz.b64
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, tarfile
          encoded = "".join(Path("jarvis-app.tar.xz.b64").read_text(encoding="ascii").split())
          encoded = encoded.rstrip("=")
          encoded += "=" * ((4 - len(encoded) % 4) % 4)
          raw = base64.b64decode(encoded, validate=True)
          print("xz_bytes=", len(raw))
          print("xz_sha256=", hashlib.sha256(raw).hexdigest())
          if raw[:6] != b"\xfd7zXZ\x00":
              raise SystemExit("Jarvis source is not XZ")
          try:
              tar_bytes = lzma.decompress(raw)
          except lzma.LZMAError as exc:
              raise SystemExit(f"Jarvis XZ decompression failed: {exc}")
          Path("jarvis-source.tar").write_bytes(tar_bytes)
          with tarfile.open("jarvis-source.tar", "r:") as tf:
              names = set(tf.getnames())
          required = {
              "jarvis-android/settings.gradle.kts",
              "jarvis-android/app/build.gradle.kts",
              "jarvis-android/app/src/main/java/com/example/jarvis/JarvisApp.kt",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit("Jarvis source missing: " + ", ".join(missing))
          print("Jarvis XZ source integrity: PASS")
          PY
          rm -rf build-src
          mkdir -p build-src
          tar -xf jarvis-source.tar -C build-src
          test -f build-src/jarvis-android/settings.gradle.kts
          test -f build-src/jarvis-android/app/build.gradle.kts
          test -f build-src/jarvis-android/app/src/main/java/com/example/jarvis/JarvisApp.kt
      - name: Set GLM-5.2 defaults
        run: |
          set -euo pipefail
          cd /tmp/jarvis-src/jarvis-android
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/build.gradle.kts")
          s=p.read_text()
          s=s.replace('buildConfigField("String", "MODEL_BASE_URL", "\"\")',
                      'buildConfigField("String", "MODEL_BASE_URL", "\"https://api.z.ai/api/paas/v4/chat/completions\"")')
          s=s.replace('buildConfigField("String", "MODEL_NAME", "\"\")',
                      'buildConfigField("String", "MODEL_NAME", "\"glm-5.2\"")')
          p.write_text(s)
          PY
          grep -q "glm-5.2" app/build.gradle.kts

      - name: Test
        working-directory: /tmp/jarvis-src/jarvis-android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        working-directory: /tmp/jarvis-src/jarvis-android
        run: gradle :app:lintRelease --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: /tmp/jarvis-src/jarvis-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp /tmp/jarvis-src/jarvis-android/app/build/outputs/apk/debug/*.apk artifacts/jarvis-debug.apk
          sha256sum artifacts/jarvis-debug.apk > artifacts/SHA256SUMS.txt
          printf 'model=glm-5.2\nsource=jarvis-2.0.0-apk-build\n' > artifacts/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-glm-5.2-apk
          path: artifacts
          if-no-files-found: error
          retention-days: 90
