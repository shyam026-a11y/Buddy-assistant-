name: Jarvis APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Jarvis source branch
        run: git fetch origin jarvis-2.0.0-apk-build && git checkout --detach origin/jarvis-2.0.0-apk-build

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Reconstruct Jarvis project
        run: |
          set -euo pipefail
          rm -rf /tmp/jarvis-src
          mkdir -p /tmp/jarvis-src
          cat .jarvis-source/pkg/q01.b64 .jarvis-source/pkg/q02.b64 .jarvis-source/pkg/q03.b64 .jarvis-source/pkg/q04.b64 .jarvis-source/pkg/q05.b64 .jarvis-source/pkg/q06.b64 .jarvis-source/pkg/q07.b64 .jarvis-source/pkg/q08.b64 .jarvis-source/pkg/q09.b64 .jarvis-source/pkg/q10.b64 .jarvis-source/pkg/q11.b64 .jarvis-source/pkg/q12.b64 .jarvis-source/pkg/q13.b64 .jarvis-source/pkg/q14.b64 .jarvis-source/pkg/q15.b64 .jarvis-source/pkg/q16.b64 > /tmp/jarvis-src.b64
          base64 -d /tmp/jarvis-src.b64 > /tmp/jarvis-src.tar.gz
          tar -xzf /tmp/jarvis-src.tar.gz -C /tmp/jarvis-src
          test -f /tmp/jarvis-src/jarvis-android/app/build.gradle.kts

      - name: Set GLM-5.2 defaults
        run: |
          set -euo pipefail
          cd /tmp/jarvis-src/jarvis-android
          sed -i 's#buildConfigField("String", "MODEL_BASE_URL", "\""\"")#buildConfigField("String", "MODEL_BASE_URL", "\"https://api.z.ai/api/paas/v4/chat/completions\"")#' app/build.gradle.kts || true
          sed -i 's#buildConfigField("String", "MODEL_NAME", "\""\"")#buildConfigField("String", "MODEL_NAME", "\"glm-5.2\"")#' app/build.gradle.kts || true
          grep -q "glm-5.2" app/build.gradle.kts

      - name: Test
        working-directory: /tmp/jarvis-src/jarvis-android
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Lint
        working-directory: /tmp/jarvis-src/jarvis-android
        run: gradle :app:lintRelease --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: /tmp/jarvis-src/jarvis-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp /tmp/jarvis-src/jarvis-android/app/build/outputs/apk/debug/*.apk artifacts/jarvis-debug.apk
          sha256sum artifacts/jarvis-debug.apk > artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-glm-5.2-apk
          path: artifacts
          if-no-files-found: error
