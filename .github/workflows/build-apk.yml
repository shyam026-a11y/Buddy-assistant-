name: Buddy Assistant APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        run: gradle test --no-daemon --stacktrace

      - name: Wake-word regression checks
        shell: bash
        run: |
          set -e
          grep -q 'n.equals("buddy")' app/src/main/java/com/shyam026/buddyassistant/CommandRouter.java
          grep -q 'n.startsWith("buddy ")' app/src/main/java/com/shyam026/buddyassistant/CommandRouter.java
          grep -q 'n.equals("hey buddy")' app/src/main/java/com/shyam026/buddyassistant/CommandRouter.java
          grep -q 'n.startsWith("hey buddy ")' app/src/main/java/com/shyam026/buddyassistant/CommandRouter.java
          grep -q 'STATE_PROCESSING' app/src/main/java/com/shyam026/buddyassistant/BuddyVoiceService.java
          grep -q 'FOREGROUND_SERVICE_MICROPHONE' app/src/main/AndroidManifest.xml

      - name: Lint
        run: gradle lintDebug --no-daemon --stacktrace

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Buddy-V3-Core
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
