name: Jarvis APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout Jarvis source branch
        run: git fetch origin jarvis-2.0.0-apk-build && git checkout --detach origin/jarvis-2.0.0-apk-build

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit)"
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Reconstruct Jarvis source
        shell: bash
        run: |
          set -euo pipefail
          test -d .jarvis-source/xzparts
          shopt -s nullglob
          parts=(.jarvis-source/xzparts/c*.b64)
          test "${#parts[@]}" -eq 55
          cat "${parts[@]}" > jarvis-app.tar.xz.b64
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, tarfile
          encoded = "".join(Path("jarvis-app.tar.xz.b64").read_text(encoding="ascii").split())
          encoded = encoded.rstrip("=")
          encoded += "=" * ((4 - len(encoded) % 4) % 4)
          raw = base64.b64decode(encoded, validate=True)
          print("xz_bytes=", len(raw))
          print("xz_sha256=", hashlib.sha256(raw).hexdigest())
          if raw[:6] != b"\xfd7zXZ\x00":
              raise SystemExit("Jarvis source is not XZ")
          try:
              tar_bytes = lzma.decompress(raw)
          except lzma.LZMAError as exc:
              raise SystemExit(f"Jarvis XZ decompression failed: {exc}")
          Path("jarvis-source.tar").write_bytes(tar_bytes)
          with tarfile.open("jarvis-source.tar", "r:") as tf:
              names = set(tf.getnames())
          required = {
              "settings.gradle.kts",
              "app/build.gradle.kts",
              "app/src/main/java/com/example/jarvis/JarvisApp.kt",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit("Jarvis source missing: " + ", ".join(missing))
          print("Jarvis XZ source integrity: PASS")
          PY
          rm -rf build-src
          mkdir -p build-src/jarvis-android
          tar -xf jarvis-source.tar -C build-src/jarvis-android
          test -f build-src/jarvis-android/settings.gradle.kts
          test -f build-src/jarvis-android/app/build.gradle.kts
          test -f build-src/jarvis-android/app/src/main/java/com/example/jarvis/JarvisApp.kt
      - name: Build pinned Kokoro AAR
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/kokoro-android
          git clone --recursive --depth 1 https://github.com/ffmpegkit-maintained/kokoro-android.git /tmp/kokoro-android
          cd /tmp/kokoro-android
          chmod +x gradlew
          cmake -S espeak-ng -B /tmp/espeak-build -DCMAKE_BUILD_TYPE=Release -DUSE_MBROLA=OFF -DUSE_LIBSONIC=OFF -DUSE_LIBPCAUDIO=OFF -DUSE_SPEECHPLAYER=OFF
          cmake --build /tmp/espeak-build --target data -j2
          test -d /tmp/espeak-build/espeak-ng-data
          rm -rf library/src/main/assets/espeak-ng-data
          mkdir -p library/src/main/assets/espeak-ng-data
          cp -r /tmp/espeak-build/espeak-ng-data/. library/src/main/assets/espeak-ng-data/
          test -f library/src/main/assets/espeak-ng-data/phontab
          ./gradlew :library:assembleRelease --no-daemon --stacktrace
          test -f library/build/outputs/aar/library-release.aar
          mkdir -p "$GITHUB_WORKSPACE/build-src/jarvis-android/app/libs"
          cp library/build/outputs/aar/library-release.aar "$GITHUB_WORKSPACE/build-src/jarvis-android/app/libs/kokoro-android-0.1.0.aar"
          sha256sum library/build/outputs/aar/library-release.aar

      - name: Wire local Kokoro AAR
        working-directory: build-src/jarvis-android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          maven = 'implementation("dev.ffmpegkit-maintained:kokoro-android:0.1.0")'
          local = 'implementation(files("libs/kokoro-android-0.1.0.aar"))'
          if maven in s:
              s = s.replace(maven, local)
          elif local not in s:
              raise SystemExit("Kokoro dependency declaration not found")
          if 'com.microsoft.onnxruntime:onnxruntime-android:1.20.0' not in s:
              anchor = 'implementation("com.squareup.okhttp3:okhttp:5.3.0")'
              if anchor not in s:
                  raise SystemExit("OkHttp dependency anchor not found")
              s = s.replace(anchor, anchor + '\n    implementation("com.microsoft.onnxruntime:onnxruntime-android:1.20.0")', 1)
          p.write_text(s)
          PY
          test -f app/libs/kokoro-android-0.1.0.aar
          grep -q 'kokoro-android-0.1.0.aar' app/build.gradle.kts
          grep -q 'onnxruntime-android:1.20.0' app/build.gradle.kts

      - name: Add pinned Shizuku source modules
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/shizuku-api
          git init -q /tmp/shizuku-api
          git -C /tmp/shizuku-api remote add origin https://github.com/RikkaApps/Shizuku-API.git
          git -C /tmp/shizuku-api fetch --depth 1 origin a27f6e4151ba7b39965ca47edb2bf0aeed7102e5
          git -C /tmp/shizuku-api checkout --detach FETCH_HEAD
          cp -a /tmp/shizuku-api/aidl build-src/jarvis-android/aidl
          cp -a /tmp/shizuku-api/shared build-src/jarvis-android/shared
          cp -a /tmp/shizuku-api/api build-src/jarvis-android/api
          cp -a /tmp/shizuku-api/provider build-src/jarvis-android/provider
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build-src/jarvis-android/settings.gradle.kts")
          s = p.read_text()
          if 'include(":aidl", ":shared", ":api", ":provider")' not in s:
              s += '\ninclude(":aidl", ":shared", ":api", ":provider")\n'
          p.write_text(s)
          PY
          test -f build-src/jarvis-android/api/src/main/java/rikka/shizuku/Shizuku.java
          test -f build-src/jarvis-android/provider/src/main/java/rikka/shizuku/ShizukuProvider.java
          test -f build-src/jarvis-android/aidl/src/main/aidl/moe/shizuku/server/IShizukuService.aidl
          for module in aidl shared api provider; do
            file="build-src/jarvis-android/$module/build.gradle"
            grep -q "compileSdk" "$file" || sed -i '/^android {/a\    compileSdk 36' "$file"
          done
          grep -q 'compileSdk 36' build-src/jarvis-android/aidl/build.gradle
          grep -q 'compileSdk 36' build-src/jarvis-android/shared/build.gradle
          grep -q 'compileSdk 36' build-src/jarvis-android/api/build.gradle
          grep -q 'compileSdk 36' build-src/jarvis-android/provider/build.gradle

      - name: Patch Jarvis compile surface
        working-directory: build-src/jarvis-android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def add_import(path, import_line, anchor):
              p = Path(path)
              s = p.read_text()
              if import_line not in s:
                  s = s.replace(anchor, import_line + chr(10) + anchor, 1)
                  p.write_text(s)

          p = Path("app/src/main/java/com/example/jarvis/JarvisApp.kt")
          s = p.read_text()
          if "import com.example.jarvis.voice.VoicePreferences" not in s:
              s = s.replace("import com.example.jarvis.voice.AndroidPcmCapture", "import com.example.jarvis.voice.VoicePreferences" + chr(10) + "import com.example.jarvis.voice.AndroidPcmCapture", 1)
              p.write_text(s)

          p = Path("app/src/main/java/com/example/jarvis/voice/VoiceSettings.kt")
          s = p.read_text()
          if "fun setSystemFallbackAllowed(allowed: Boolean)" not in s:
              needle = "    fun getTuning(): VoiceTuning = tuning"
              if needle not in s:
                  raise SystemExit("Voice controller insertion point not found")
              s = s.replace(
                  needle,
                  "    fun setSystemFallbackAllowed(allowed: Boolean) {" + chr(10) +
                  "        output.setSystemFallbackAllowed(allowed)" + chr(10) +
                  "    }" + chr(10) + chr(10) + needle,
                  1,
              )
              p.write_text(s)

          p = Path("app/src/main/java/com/example/jarvis/MainActivity.kt")
          s = p.read_text()
          if "@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)" not in s:
              s = "@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)" + chr(10) + s
          add_import("app/src/main/java/com/example/jarvis/MainActivity.kt", "import kotlinx.coroutines.launch", "import java.util.Locale")
          s = p.read_text()
          s = s.replace(
              "onOpenAccessibility = { startActivitySafely(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS)) },",
              "onOpenAccessibility = { app.startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).apply { addFlags(Intent.FLAG_ACTIVITY_NEW_TASK) }) },",
              1,
          )
          p.write_text(s)

          add_import(
              "app/src/main/java/com/example/jarvis/agent/JarvisEngine.kt",
              "import kotlinx.coroutines.launch",
              "import com.example.jarvis.security.MemorySafetyPolicy",
          )
          add_import(
              "app/src/main/java/com/example/jarvis/task/TaskManager.kt",
              "import kotlinx.coroutines.sync.Mutex",
              "import kotlinx.coroutines.channels.Channel",
          )
          add_import(
              "app/src/main/java/com/example/jarvis/task/TaskManager.kt",
              "import kotlinx.coroutines.sync.withLock",
              "import kotlinx.coroutines.sync.Mutex",
          )

          p = Path("app/build.gradle.kts")
          lines = p.read_text().splitlines()
          lines = [
              line for line in lines
              if "dev.rikka.shizuku:" not in line
              and "shizuku-api-13.1.5.jar" not in line
              and "shizuku-shared-13.1.5.jar" not in line
              and "shizuku-aidl-13.1.5.jar" not in line
              and "provider-13.1.5.aar" not in line
              and "api-13.1.5.aar" not in line
              and "shared-13.1.5.aar" not in line
              and "aidl-13.1.5.aar" not in line
          ]
          anchor = 'implementation("com.squareup.okhttp3:okhttp:5.3.0")'
          i = next((i for i, line in enumerate(lines) if anchor in line), None)
          if i is None:
              raise SystemExit("OkHttp dependency anchor not found")
          lines[i + 1:i + 1] = [
              '    implementation(project(":api"))',
              '    implementation(project(":provider"))',
          ]
          p.write_text(chr(10).join(lines) + chr(10))
          PY

          grep -q 'implementation(project(":api"))' app/build.gradle.kts
          grep -q 'implementation(project(":provider"))' app/build.gradle.kts
          grep -q 'fun setSystemFallbackAllowed' app/src/main/java/com/example/jarvis/voice/VoiceSettings.kt
          grep -q 'import kotlinx.coroutines.launch' app/src/main/java/com/example/jarvis/MainActivity.kt
          grep -q 'import kotlinx.coroutines.sync.Mutex' app/src/main/java/com/example/jarvis/task/TaskManager.kt

      - name: Pin AndroidX compatibility set
        working-directory: build-src/jarvis-android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          s = p.read_text()
          replacements = {
              'androidx.compose:compose-bom:2026.09.00': 'androidx.compose:compose-bom:2025.09.00',
              'androidx.core:core-ktx:1.19.0': 'androidx.core:core-ktx:1.17.0',
              'androidx.activity:activity-compose:1.13.0': 'androidx.activity:activity-compose:1.11.0',
              'androidx.lifecycle:lifecycle-runtime-compose:2.10.0': 'androidx.lifecycle:lifecycle-runtime-compose:2.9.4',
              'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0': 'androidx.lifecycle:lifecycle-viewmodel-compose:2.9.4',
              'androidx.navigation:navigation-compose:2.9.8': 'androidx.navigation:navigation-compose:2.9.5',
              'androidx.work:work-runtime-ktx:2.11.2': 'androidx.work:work-runtime-ktx:2.10.5',
              'androidx.datastore:datastore-preferences:1.2.1': 'androidx.datastore:datastore-preferences:1.1.7',
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          p.write_text(s)
          PY
          grep -q 'compose-bom:2025.09.00' app/build.gradle.kts
          grep -q 'core-ktx:1.17.0' app/build.gradle.kts
          grep -q 'activity-compose:1.11.0' app/build.gradle.kts
          grep -q 'lifecycle-runtime-compose:2.9.4' app/build.gradle.kts
          grep -q 'navigation-compose:2.9.5' app/build.gradle.kts
          grep -q 'work-runtime-ktx:2.10.5' app/build.gradle.kts
          grep -q 'datastore-preferences:1.1.7' app/build.gradle.kts

      - name: Set GLM-5.2 defaults
        working-directory: build-src/jarvis-android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/build.gradle.kts")
          lines = p.read_text().splitlines()
          out = []
          base = False
          model = False
          for line in lines:
              stripped = line.strip()
              if 'buildConfigField("String", "MODEL_BASE_URL"' in stripped:
                  line = '        buildConfigField("String", "MODEL_BASE_URL", "\\"https://api.z.ai/api/paas/v4/chat/completions\\"")'
                  base = True
              elif 'buildConfigField("String", "MODEL_NAME"' in stripped:
                  line = '        buildConfigField("String", "MODEL_NAME", "\\"glm-5.2\\"")'
                  model = True
              out.append(line)
          if not (base and model):
              raise SystemExit(f"GLM config declarations not found: base={base}, model={model}")
          p.write_text("\n".join(out) + "\n")
          PY
          grep -q 'MODEL_BASE_URL' app/build.gradle.kts
          grep -q 'MODEL_NAME' app/build.gradle.kts
          grep -q 'glm-5.2' app/build.gradle.kts
      - name: Decouple Shizuku compile-time API
        working-directory: build-src/jarvis-android
        shell: bash
        run: |
          set -euo pipefail
          cat > app/src/main/java/com/example/jarvis/android/ShizukuBackend.kt <<'EOF'
          package com.example.jarvis.android

          import android.content.Context
          import android.content.pm.PackageManager

          class ShizukuBackend(private val context: Context) : ControlBackend {
              override val name = "shizuku"

              private val shizukuClass: Class<*>? by lazy {
                  runCatching { Class.forName("rikka.shizuku.Shizuku") }.getOrNull()
              }

              override fun available(): Boolean {
                  val clazz = shizukuClass ?: return false
                  return runCatching {
                      val ping = clazz.getMethod("pingBinder").invoke(null) as Boolean
                      val permission = clazz.getMethod("checkSelfPermission").invoke(null) as Int
                      ping && permission == PackageManager.PERMISSION_GRANTED
                  }.getOrDefault(false)
              }

              override suspend fun openApp(packageName: String): Result<Unit> = runCatching {
                  val intent = context.packageManager.getLaunchIntentForPackage(packageName)
                      ?: error("No launcher activity")
                  intent.addFlags(android.content.Intent.FLAG_ACTIVITY_NEW_TASK)
                  context.startActivity(intent)
              }

              override suspend fun tap(x: Int, y: Int): Result<Unit> =
                  runCatching { exec("input", "tap", x.toString(), y.toString()) }

              override suspend fun typeText(text: String): Result<Unit> =
                  runCatching { exec("input", "text", text.replace(" ", "%s")) }

              override suspend fun back(): Result<Unit> =
                  runCatching { exec("input", "keyevent", "4") }

              override suspend fun screenText(): Result<String> =
                  runCatching { exec("dumpsys", "window", "windows") }

              private fun exec(vararg cmd: String): String {
                  check(available()) { "Shizuku unavailable or unauthorized" }
                  val clazz = shizukuClass ?: error("Shizuku unavailable")
                  val method = clazz.getMethod(
                      "newProcess",
                      Array<String>::class.java,
                      Array<String>::class.java,
                      String::class.java,
                  )
                  val process = method.invoke(null, cmd, null, null) as Process
                  val out = process.inputStream.bufferedReader().readText()
                  val err = process.errorStream.bufferedReader().readText()
                  check(process.waitFor() == 0) { err.take(500) }
                  return out
              }
          }
          EOF
          ! grep -q 'import dev.rikka.shizuku.Shizuku' app/src/main/java/com/example/jarvis/android/ShizukuBackend.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/com/example/jarvis/MainActivity.kt")
          s = p.read_text()
          opt = "@file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)"
          if opt not in s:
              p.write_text(opt + "\n" + s)
          PY
          grep -q 'androidx.compose.material3.ExperimentalMaterial3Api' app/src/main/java/com/example/jarvis/MainActivity.kt
          test -s app/src/main/java/com/example/jarvis/android/ShizukuBackend.kt
      - name: Test
        working-directory: build-src/jarvis-android
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ../../artifacts
          gradle :app:testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee ../../artifacts/test.log

      - name: Lint
        working-directory: build-src/jarvis-android
        run: gradle :app:lintRelease --no-daemon --stacktrace

      - name: Build debug APK
        working-directory: build-src/jarvis-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          mkdir -p artifacts
          cp build-src/jarvis-android/app/build/outputs/apk/debug/*.apk artifacts/jarvis-debug.apk
          sha256sum artifacts/jarvis-debug.apk > artifacts/SHA256SUMS.txt
          printf 'model=glm-5.2\nsource=jarvis-2.0.0-apk-build\n' > artifacts/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-glm-5.2-apk
          path: artifacts
          if-no-files-found: error
          retention-days: 90
