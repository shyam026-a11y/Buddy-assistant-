name: Jarvis Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Fetch Jarvis release branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin jarvis-2.0.0-apk-build:refs/remotes/origin/jarvis-2.0.0-apk-build

      - name: Reconstruct Jarvis source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf jarvis-payload build-src
          mkdir -p jarvis-payload build-src
          git archive origin/jarvis-2.0.0-apk-build .jarvis-source | tar -x -C jarvis-payload
          shopt -s nullglob
          chunks=(jarvis-payload/.jarvis-source/pkg/q*.b64)
          test "${#chunks[@]}" -eq 16
          cat "${chunks[@]}" > jarvis-source.b64
          base64 -d -i jarvis-source.b64 -o jarvis-source.tar.gz
          tar -tzf jarvis-source.tar.gz >/dev/null
          tar -xzf jarvis-source.tar.gz -C build-src
          test -f build-src/jarvis-android/app/build.gradle.kts
          echo "Jarvis source reconstruction: PASS"

      - name: Enable GLM-5.2 defaults
        working-directory: build-src/jarvis-android
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              'buildConfigField("String", "MODEL_BASE_URL", "\"\")',
              'buildConfigField("String", "MODEL_BASE_URL", "\"https://api.z.ai/api/paas/v4/chat/completions\"")'
          )
          s = s.replace(
              'buildConfigField("String", "MODEL_NAME", "\"\")',
              'buildConfigField("String", "MODEL_NAME", "\"glm-5.2\"")'
          )
          p.write_text(s)

          p = Path("app/src/main/java/com/example/jarvis/MainActivity.kt")
          s = p.read_text()
          marker = '''                OutlinedTextField(
                    value = apiKey,
                    onValueChange = { apiKey = it },
                    modifier = Modifier.fillMaxWidth(),
                    label = { Text("API key (optional)") },
                    visualTransformation = PasswordVisualTransformation(),
                    singleLine = true,
                )
'''
          addition = marker + '''                Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                    OutlinedButton(onClick = {
                        endpoint = "https://api.z.ai/api/paas/v4/chat/completions"
                        model = "glm-5.2"
                    }) {
                        Text("Use GLM-5.2")
                    }
                }
                Text(
                    "GLM-5.2 runs on a hosted service or separate inference server. The phone keeps the control and security layers local.",
                    style = MaterialTheme.typography.bodySmall
                )
'''
          if 'Text("Use GLM-5.2")' not in s:
              if marker not in s:
                  raise SystemExit("GLM settings insertion point not found")
              s = s.replace(marker, addition, 1)
          p.write_text(s)
          PY
          grep -q 'glm-5.2' app/build.gradle.kts
          grep -q 'Use GLM-5.2' app/src/main/java/com/example/jarvis/MainActivity.kt

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f -print -quit)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.13"

      - name: Unit tests and lint
        working-directory: build-src/jarvis-android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh 2>/dev/null || true
          gradle :app:testDebugUnitTest :app:lintRelease --no-daemon --stacktrace

      - name: Build APK
        working-directory: build-src/jarvis-android
        shell: bash
        run: |
          set -euo pipefail
          gradle :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find build-src/jarvis-android/app/build/outputs -type f -name '*.apk' -print -exec cp {} artifacts/ \;
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
          {
            echo "source_branch=jarvis-2.0.0-apk-build"
            echo "source_commit=$(git rev-parse origin/jarvis-2.0.0-apk-build)"
            echo "build_commit=$GITHUB_SHA"
            echo "model=glm-5.2"
          } > artifacts/BUILD_INFO.txt
          ls -lh artifacts/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-glm-5.2-apks
          path: artifacts/
          if-no-files-found: error
          retention-days: 90
