name: Jarvis GLM-5.2 APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
      - name: Reconstruct release source
        shell: bash
        run: |
          set -euo pipefail
          test -d .jarvis-source/pkg
          shopt -s nullglob
          chunks=(.jarvis-source/pkg/q*.b64)
          test "${#chunks[@]}" -eq 16
          cat "${chunks[@]}" > jarvis-source.b64
          base64 -d -i jarvis-source.b64 -o jarvis-source.tar.gz
          tar -tzf jarvis-source.tar.gz >/dev/null
          rm -rf build-src
          mkdir -p build-src
          tar -xzf jarvis-source.tar.gz -C build-src
          test -f build-src/jarvis-android/app/build.gradle.kts
          echo "Source reconstruction: PASS"
      - name: Build and test
        working-directory: build-src/jarvis-android
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh 2>/dev/null || true
          gradle :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find build-src/jarvis-android/app/build/outputs -type f -name '*.apk' -print -exec cp {} artifacts/ ;
          test -n "$(find artifacts -type f -name '*.apk' -print -quit)"
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt
          ls -lh artifacts/
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-glm-5.2-apks
          path: artifacts/
