name: Jarvis 2.0.0 APK

on:
  push:
    branches: [jarvis-2.0.0-release]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Verify Jarvis source chunks
        shell: bash
        run: |
          set -euo pipefail
          cat > chunk_hashes.txt <<'EOF'
e9dce2c4798613d59a2aa23515368c0f1950fa177abc20406072fe0061ce7cf1  .jarvis-source/pkg/q01.b64
b415a2ac45cabcec0a953af1ceae027b7301a5f690caf4a6d7af990858bdf389  .jarvis-source/pkg/q02.b64
74bd05a67b68e8f83a503828d8c905ccc99c3a452ce847b7af36e542a97dad14  .jarvis-source/pkg/q03.b64
1f846e6faf503f835d01df97de02b273506b64e71e0febfc985fa8643c5928b7  .jarvis-source/pkg/q04.b64
c162b735155e7873bef9bfe3f11da4f7a8894e93b0a62a5f1932a5fdcc058368  .jarvis-source/pkg/q05.b64
5cb477b5bb6ca8b9f95314ddc88b2dceee207fca87830e9216f7d57d8c47bfa6  .jarvis-source/pkg/q06.b64
924fa20cf01850fb3278afa50f370406b28edc79ad7f2073bcca3b674dcc6c28  .jarvis-source/pkg/q07.b64
69e36f32bbed5b4023534ac9fde09b076f58dbfffa5b1171f9919ba687b94577  .jarvis-source/pkg/q08.b64
292b3991c5fe8b5ccef2105ee292df9315a87d93450a331a3b69fbfb08e17d91  .jarvis-source/pkg/q09.b64
a33ca8a55a4688afe4bd8c1329f9633ba0a9dfd9dbf858f88ccb3071cf3f92c6  .jarvis-source/pkg/q10.b64
e1e0dd399fde67c4ab47eeddd5b7a01fa7f1badf27107cc34754d1abf323f7ca  .jarvis-source/pkg/q11.b64
d40f464bef18e16edfdf7a13a603b43ed7684ad65450a8bae94dc3ac0f81672f  .jarvis-source/pkg/q12.b64
ee4abbd69f42256235b01161dea1421696b7ab3896c8f90bbfe77af55f6a74b0  .jarvis-source/pkg/q13.b64
fba66002751ee4c4dbe4c47b97f6058df8aa8b6761124e3c2ac9e505e44e51dc  .jarvis-source/pkg/q14.b64
79ba58014b58b2f0ff49543f5b022701d28f229dc78072630404f40647cdce77  .jarvis-source/pkg/q15.b64
2b0237833034662c465be74227e57fd96b142daef96b09bf7360b8186fb506ca  .jarvis-source/pkg/q16.b64
EOF
          sha256sum -c chunk_hashes.txt
          cat .jarvis-source/pkg/q{01..16}.b64 > jarvis-source.b64
          base64 -d -i jarvis-source.b64 -o jarvis-source.tar.gz
          echo "0ed050614600a359e6e4eeed9b4de7212cc462c73fc61c87ec52cc8ca85e26c9  jarvis-source.tar.gz" | sha256sum -c -
          mkdir -p build-src
          tar -xzf jarvis-source.tar.gz -C build-src

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build and test
        working-directory: build-src/jarvis-android
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh 2>/dev/null || true
          gradle :app:testDebugUnitTest :app:lintRelease :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Collect APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find build-src/jarvis-android/app/build/outputs -type f -name '*.apk' -print -exec cp {} artifacts/ \;
          sha256sum artifacts/*.apk > artifacts/SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-2.0.0-apks
          path: artifacts/
