name: Buddy Assistant APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Buddy Android project
        shell: bash
        run: |
          cat > /tmp/buddy-source.b64 <<'BUDDY_SOURCE_EOF'

BUDDY_SOURCE_EOF
          base64 -d /tmp/buddy-source.b64 > /tmp/buddy-source.zip
          rm -rf /tmp/buddy-project
          mkdir -p /tmp/buddy-project
          unzip -q /tmp/buddy-source.zip -d /tmp/buddy-project
          cp -a /tmp/buddy-project/. "$GITHUB_WORKSPACE/"
          echo "Project files:"
          find "$GITHUB_WORKSPACE" -maxdepth 3 -type f | sort

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android SDK packages
        shell: bash
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify Android project
        shell: bash
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          echo "Android project detected successfully."

      - name: Build APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Buddy-Assistant-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
